{% extends 'base.html' %}

{% block title %}Importar PGN para Análisis - Ajedrez Escolar{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <div>
            <h1>Importar Partida PGN</h1>
            <p style="color: var(--text-secondary);">Ingresa el texto PGN o sube un archivo para analizarlo con Stockfish.</p>
        </div>
        <a href="{% url 'challenges_list' %}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="pgn_text">Copiar / Pegar Texto PGN:</label>
                <textarea id="pgn_text" name="pgn_text" rows="8" class="form-control" placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6..."></textarea>
            </div>

            <div class="form-group" style="margin-top: 1.5rem;">
                <label for="pgn_file">O Subir Archivo (.pgn):</label>
                <input type="file" id="pgn_file" name="pgn_file" accept=".pgn" class="form-control" style="padding: 0.5rem;">
            </div>

            <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem; font-size: 1rem;">
                    🚀 Iniciar Análisis de Stockfish
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
