{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Ajedrez Escolar{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Acceso a la Plataforma</h2>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username" class="form-input" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" class="form-input" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Ingresar
            </button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="{% url 'register' %}" style="color: var(--accent-color);">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}
