{% extends 'base.html' %}

{% block title %}Crear Aula - Ajedrez Escolar{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>➕ Crear Nueva Aula</h2>
        <form method="post" style="margin-top: 1rem;">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="name">Nombre del Aula</label>
                <input type="text" id="name" name="name" class="form-input" value="{{ name|default:'' }}" required maxlength="150">
            </div>
            <div class="form-group">
                <label class="form-label" for="description">Descripción</label>
                <textarea id="description" name="description" class="form-input" rows="3">{{ description|default:'' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Crear Aula</button>
        </form>
    </div>
</div>
{% endblock %}
